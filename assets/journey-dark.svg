<rect x="452.0" y="46" width="190.0" height="88" rx="6" fill="#151b23" stroke="#3d444d" stroke-width="1"/><text x="468.0" y="72" font-size="12" font-weight="600" letter-spacing="0.8" fill="#9198a1">2023 – 2024</text><text x="468.0" y="98" font-size="15" font-weight="600" fill="#f0f6fc">Data Analyst</text><text x="468.0" y="120" font-size="13" fill="#9198a1">UBYCALL · analytics, BI</text>
