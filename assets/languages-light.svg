<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="368" viewBox="0 0 1200 368" role="img" aria-label="Lines of code by language across production repositories" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Lines of code by language across production repositories</title>
<rect x="1" y="1" width="1198" height="366" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="40" y="48" font-size="19" font-weight="700" fill="#1f2328">Code shipped across 15 production repositories</text>
<text x="40" y="74" font-size="13" fill="#59636e">484K non-blank lines by language · TypeScript and Python account for 85%</text>
<line x1="190" y1="90" x2="190" y2="316" stroke="#d0d7de"/>
