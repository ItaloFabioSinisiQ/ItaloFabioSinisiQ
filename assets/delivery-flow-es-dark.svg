<svg xmlns="http://www.w3.org/2000/svg" width="880" height="232" viewBox="0 0 880 232" role="img" aria-label="Un día de ruta" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Un día de ruta</title>
<style>.flow{stroke-dasharray:5 5;animation:flow 1.4s linear infinite}@keyframes flow{to{stroke-dashoffset:-20}}@media (prefers-reduced-motion:reduce){.flow{animation:none;stroke-dasharray:none}}</style><rect x="0.5" y="0.5" width="879" height="231" rx="6" fill="#151b23" stroke="#3d444d"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4493f8"/></marker></defs>
<text x="24" y="34" font-size="12" font-weight="600" letter-spacing="0.8" fill="#9198a1">UN DÍA DE RUTA</text>
<rect x="24" y="52" width="144" height="108" rx="6" fill="#0d1117" stroke="#3d444d"/><circle cx="48" cy="78" r="11" fill="#4493f8"/><text x="48" y="82.5" font-size="12" font-weight="700" text-anchor="middle" fill="#0d1117">1</text><text x="66" y="83" font-size="14" font-weight="600" fill="#f0f6fc">Sync del ERP</text>
<text x="38" y="112" font-size="13" fill="#9198a1">Pedidos, rutas y</text>
<text x="38" y="130" font-size="13" fill="#9198a1">promociones a</text>
<text x="38" y="148" font-size="13" fill="#9198a1">las 06:00</text>
<path d="M171,106.0 H193" fill="none" stroke="#4493f8" stroke-width="1.5" class="flow" marker-end="url(#arrow)"/>
<rect x="196" y="52" width="144" height="108" rx="6" fill="#0d1117" stroke="#3d444d"/><circle cx="220" cy="78" r="11" fill="#4493f8"/><text x="220" y="82.5" font-size="12" font-weight="700" text-anchor="middle" fill="#0d1117">2</text><text x="238" y="83" font-size="14" font-weight="600" fill="#f0f6fc">Despacho</text>
<text x="210" y="112" font-size="13" fill="#9198a1">Cada tripulación</text>
<text x="210" y="130" font-size="13" fill="#9198a1">recibe su ruta</text>
<text x="210" y="148" font-size="13" fill="#9198a1">en la app</text>
<path d="M343,106.0 H365" fill="none" stroke="#4493f8" stroke-width="1.5" class="flow" marker-end="url(#arrow)"/>
<rect x="368" y="52" width="144" height="108" rx="6" fill="#0d1117" stroke="#3d444d"/><circle cx="392" cy="78" r="11" fill="#4493f8"/><text x="392" y="82.5" font-size="12" font-weight="700" text-anchor="middle" fill="#0d1117">3</text><text x="410" y="83" font-size="14" font-weight="600" fill="#f0f6fc">Entrega</text>
<text x="382" y="112" font-size="13" fill="#9198a1">Entregado, parcial</text>
<text x="382" y="130" font-size="13" fill="#9198a1">o rechazado, con</text>
<text x="382" y="148" font-size="13" fill="#9198a1">foto y GPS</text>
<path d="M515,106.0 H537" fill="none" stroke="#4493f8" stroke-width="1.5" class="flow" marker-end="url(#arrow)"/>
<rect x="540" y="52" width="144" height="108" rx="6" fill="#0d1117" stroke="#3d444d"/><circle cx="564" cy="78" r="11" fill="#4493f8"/><text x="564" y="82.5" font-size="12" font-weight="700" text-anchor="middle" fill="#0d1117">4</text><text x="582" y="83" font-size="14" font-weight="600" fill="#f0f6fc">Validación</text>
<text x="554" y="112" font-size="13" fill="#9198a1">Se recalculan</text>
<text x="554" y="130" font-size="13" fill="#9198a1">promociones</text>
<text x="554" y="148" font-size="13" fill="#9198a1">y montos</text>
<path d="M687,106.0 H709" fill="none" stroke="#4493f8" stroke-width="1.5" class="flow" marker-end="url(#arrow)"/>
<rect x="712" y="52" width="144" height="108" rx="6" fill="#0d1117" stroke="#3d444d"/><circle cx="736" cy="78" r="11" fill="#4493f8"/><text x="736" y="82.5" font-size="12" font-weight="700" text-anchor="middle" fill="#0d1117">5</text><text x="754" y="83" font-size="14" font-weight="600" fill="#f0f6fc">Liquidación</text>
<text x="726" y="112" font-size="13" fill="#9198a1">Monto por</text>
<text x="726" y="130" font-size="13" fill="#9198a1">tripulante y</text>
<text x="726" y="148" font-size="13" fill="#9198a1">reportes de cierre</text>
<line x1="24" y1="184" x2="856" y2="184" stroke="#3d444d"/><circle cx="30" cy="209" r="4" fill="#4493f8"/><text x="42" y="213" font-size="12" font-weight="600" letter-spacing="0.8" fill="#9198a1">EN VIVO</text><text x="119" y="213" font-size="13" fill="#f0f6fc">Mapa de la flota · alertas por montos sin cobrar sobre S/ 1,000 · rutas detenidas</text>
</svg>
