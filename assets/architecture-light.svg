<svg xmlns="http://www.w3.org/2000/svg" width="880" height="562" viewBox="0 0 880 562" role="img" aria-label="Arquitectura de RutaLiquidador, en producción. La app del chofer (React Native, Expo, offline-first con cola cifrada, GPS en segundo plano, mapa MapLibre) y la web de oficina (React, Vite, Tailwind, mapa Leaflet, mapa en vivo por polling cada 3 segundos) entran por Nginx (TLS, proxy inverso), única entrada de un stack Docker Compose. Dentro del stack: la API (FastAPI, SQLAlchemy async, Alembic, JWT), que también sirve la web; el scheduler (APScheduler, misma imagen que la API) que sincroniza el ERP y envía reportes y alertas; PostgreSQL 16 como sistema de registro; OSRM para ruteo, accesible solo a través de la API; un servidor de teselas con el mapa de Lima que la app usa a través de Nginx; y un gateway de WhatsApp en Node.js al que la API envía alertas. Fuera del stack, el ERP en SQL Server se consulta en modo solo lectura. GitHub Actions ejecuta las pruebas y, con un tag de versión, publica las imágenes de contenedor; el despliegue es un pull manual." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Arquitectura de RutaLiquidador, en producción. La app del chofer (React Native, Expo, offline-first con cola cifrada, GPS en segundo plano, mapa MapLibre) y la web de oficina (React, Vite, Tailwind, mapa Leaflet, mapa en vivo por polling cada 3 segundos) entran por Nginx (TLS, proxy inverso), única entrada de un stack Docker Compose. Dentro del stack: la API (FastAPI, SQLAlchemy async, Alembic, JWT), que también sirve la web; el scheduler (APScheduler, misma imagen que la API) que sincroniza el ERP y envía reportes y alertas; PostgreSQL 16 como sistema de registro; OSRM para ruteo, accesible solo a través de la API; un servidor de teselas con el mapa de Lima que la app usa a través de Nginx; y un gateway de WhatsApp en Node.js al que la API envía alertas. Fuera del stack, el ERP en SQL Server se consulta en modo solo lectura. GitHub Actions ejecuta las pruebas y, con un tag de versión, publica las imágenes de contenedor; el despliegue es un pull manual.</title>
