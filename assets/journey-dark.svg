<svg xmlns="http://www.w3.org/2000/svg" width="880" height="150" viewBox="0 0 880 150" role="img" aria-label="Career path" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Career path</title>
<style>.flow{stroke-dasharray:5 5;animation:flow 1.4s linear infinite}@keyframes flow{to{stroke-dashoffset:-20}}@media (prefers-reduced-motion:reduce){.flow{animation:none;stroke-dasharray:none}}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4493f8"/></marker></defs>
<text x="24" y="26" font-size="12" font-weight="600" letter-spacing="0.8" fill="#9198a1">FROM DATA TO SOFTWARE</text>
<rect x="24" y="46" width="256" height="88" rx="6" fill="#151b23" stroke="#3d444d" stroke-width="1"/><text x="42" y="72" font-size="12" font-weight="600" letter-spacing="0.8" fill="#9198a1">2022</text><text x="42" y="98" font-size="16" font-weight="600" fill="#f0f6fc">Financial Analyst</text><text x="42" y="120" font-size="13" fill="#9198a1">Alfin Banco · credit risk ML, ETL</text>
<path d="M283,90.0 H309" fill="none" stroke="#4493f8" stroke-width="1.5" class="flow" marker-end="url(#arrow)"/>
<rect x="312" y="46" width="256" height="88" rx="6" fill="#151b23" stroke="#3d444d" stroke-width="1"/><text x="330" y="72" font-size="12" font-weight="600" letter-spacing="0.8" fill="#9198a1">2023 – 2024</text><text x="330" y="98" font-size="16" font-weight="600" fill="#f0f6fc">Data Analyst</text><text x="330" y="120" font-size="13" fill="#9198a1">UBYCALL · predictive analytics, BI</text>
<path d="M571,90.0 H597" fill="none" stroke="#4493f8" stroke-width="1.5" class="flow" marker-end="url(#arrow)"/>
<rect x="600" y="46" width="256" height="88" rx="6" fill="#151b23" stroke="#4493f8" stroke-width="1.5"/><text x="618" y="72" font-size="12" font-weight="600" letter-spacing="0.8" fill="#9198a1">2025 – PRESENT</text><text x="618" y="98" font-size="16" font-weight="600" fill="#f0f6fc">Full Stack Developer</text><text x="618" y="120" font-size="13" fill="#9198a1">Auren · logistics and BI platforms</text>
</svg>
