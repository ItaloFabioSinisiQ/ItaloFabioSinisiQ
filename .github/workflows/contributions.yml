name: Update contributions graph

on:
  schedule:
    - cron: "17 5 * * *" # daily, shortly after midnight in Lima (GMT-5)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contributions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Render contribution graphs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/contributions.py

      - name: Commit if the graphs changed
        run: |
          git add assets/contributions-dark.svg assets/contributions-light.svg
          if git diff --cached --quiet; then
            echo "No changes in the contributions graph."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(profile): update contributions graph"
          git push
