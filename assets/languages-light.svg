<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="358" viewBox="0 0 1200 358" role="img" aria-label="Lines of code by language across production repositories" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Lines of code by language across production repositories</title>
<rect x="0.5" y="0.5" width="1199" height="357" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="40" y="50" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1f2328">Code shipped across 15 production repositories</text>
<text x="40" y="76" font-size="13" fill="#59636e">484K non-blank lines by language · TypeScript and Python account for 85%</text>
<line x1="180" y1="92" x2="180" y2="306" stroke="#d0d7de"/>
<text x="150" y="117" font-size="14" fill="#1f2328" text-anchor="end">TypeScript</text><rect x="180" y="103" width="820.0" height="18" rx="3" fill="#2a78d6"/><text x="1012.0" y="117" font-size="13" fill="#59636e"><tspan font-weight="600" fill="#1f2328">44.8%</tspan>  ·  217K lines</text><text x="150" y="153" font-size="14" fill="#1f2328" text-anchor="end">Python</text><rect x="180" y="139" width="744.6" height="18" rx="3" fill="#2a78d6"/><text x="936.6" y="153" font-size="13" fill="#59636e"><tspan font-weight="600" fill="#1f2328">40.7%</tspan>  ·  197K lines</text><text x="150" y="189" font-size="14" fill="#1f2328" text-anchor="end">HTML / CSS</text><rect x="180" y="175" width="101.1" height="18" rx="3" fill="#2a78d6"/><text x="293.1" y="189" font-size="13" fill="#59636e"><tspan font-weight="600" fill="#1f2328">5.5%</tspan>  ·  27K lines</text><text x="150" y="225" font-size="14" fill="#1f2328" text-anchor="end">JavaScript</text><rect x="180" y="211" width="97.2" height="18" rx="3" fill="#2a78d6"/><text x="289.2" y="225" font-size="13" fill="#59636e"><tspan font-weight="600" fill="#1f2328">5.3%</tspan>  ·  26K lines</text><text x="150" y="261" font-size="14" fill="#1f2328" text-anchor="end">Shell</text><rect x="180" y="247" width="54.0" height="18" rx="3" fill="#2a78d6"/><text x="246.0" y="261" font-size="13" fill="#59636e"><tspan font-weight="600" fill="#1f2328">2.9%</tspan>  ·  14K lines</text><text x="150" y="297" font-size="14" fill="#1f2328" text-anchor="end">SQL</text><rect x="180" y="283" width="13.3" height="18" rx="3" fill="#2a78d6"/><text x="205.3" y="297" font-size="13" fill="#59636e"><tspan font-weight="600" fill="#1f2328">0.7%</tspan>  ·  4K lines</text>
<text x="40" y="340" font-size="11" fill="#6e7781">Measured from private repositories with git ls-files · dependencies, builds and docs excluded</text>
