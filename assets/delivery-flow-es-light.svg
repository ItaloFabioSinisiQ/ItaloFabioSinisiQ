<svg xmlns="http://www.w3.org/2000/svg" width="880" height="232" viewBox="0 0 880 232" role="img" aria-label="Un día de ruta" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Un día de ruta</title>
<style>.flow{stroke-dasharray:5 5;animation:flow 1.4s linear infinite}@keyframes flow{to{stroke-dashoffset:-20}}@media (prefers-reduced-motion:reduce){.flow{animation:none;stroke-dasharray:none}}</style><rect x="0.5" y="0.5" width="879" height="231" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker></defs>
<text x="24" y="34" font-size="12" font-weight="600" letter-spacing="0.8" fill="#59636e">UN DÍA DE RUTA</text>
<rect x="24" y="52" width="144" height="108" rx="6" fill="#ffffff" stroke="#d0d7de"/><circle cx="48" cy="78" r="11" fill="#0969da"/><text x="48" y="82.5" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">1</text><text x="66" y="83" font-size="14" font-weight="600" fill="#1f2328">Sync del ERP</text>
<text x="38" y="112" font-size="13" fill="#59636e">Pedidos, rutas y</text>
<text x="38" y="130" font-size="13" fill="#59636e">promociones a</text>
<text x="38" y="148" font-size="13" fill="#59636e">las 06:00</text>
<path d="M171,106.0 H193" fill="none" stroke="#0969da" stroke-width="1.5" class="flow" marker-end="url(#arrow)"/>
<rect x="196" y="52" width="144" height="108" rx="6" fill="#ffffff" stroke="#d0d7de"/><circle cx="220" cy="78" r="11" fill="#0969da"/><text x="220" y="82.5" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">2</text><text x="238" y="83" font-size="14" font-weight="600" fill="#1f2328">Despacho</text>
<text x="210" y="112" font-size="13" fill="#59636e">Cada tripulación</text>
<text x="210" y="130" font-size="13" fill="#59636e">recibe su ruta</text>
<text x="210" y="148" font-size="13" fill="#59636e">en la app</text>
<path d="M343,106.0 H365" fill="none" stroke="#0969da" stroke-width="1.5" class="flow" marker-end="url(#arrow)"/>
<rect x="368" y="52" width="144" height="108" rx="6" fill="#ffffff" stroke="#d0d7de"/><circle cx="392" cy="78" r="11" fill="#0969da"/><text x="392" y="82.5" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">3</text><text x="410" y="83" font-size="14" font-weight="600" fill="#1f2328">Entrega</text>
<text x="382" y="112" font-size="13" fill="#59636e">Entregado, parcial</text>
<text x="382" y="130" font-size="13" fill="#59636e">o rechazado, con</text>
<text x="382" y="148" font-size="13" fill="#59636e">foto y GPS</text>
<path d="M515,106.0 H537" fill="none" stroke="#0969da" stroke-width="1.5" class="flow" marker-end="url(#arrow)"/>
<rect x="540" y="52" width="144" height="108" rx="6" fill="#ffffff" stroke="#d0d7de"/><circle cx="564" cy="78" r="11" fill="#0969da"/><text x="564" y="82.5" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">4</text><text x="582" y="83" font-size="14" font-weight="600" fill="#1f2328">Validación</text>
<text x="554" y="112" font-size="13" fill="#59636e">Se recalculan</text>
<text x="554" y="130" font-size="13" fill="#59636e">promociones</text>
<text x="554" y="148" font-size="13" fill="#59636e">y montos</text>
<path d="M687,106.0 H709" fill="none" stroke="#0969da" stroke-width="1.5" class="flow" marker-end="url(#arrow)"/>
<rect x="712" y="52" width="144" height="108" rx="6" fill="#ffffff" stroke="#d0d7de"/><circle cx="736" cy="78" r="11" fill="#0969da"/><text x="736" y="82.5" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">5</text><text x="754" y="83" font-size="14" font-weight="600" fill="#1f2328">Liquidación</text>
<text x="726" y="112" font-size="13" fill="#59636e">Monto por</text>
<text x="726" y="130" font-size="13" fill="#59636e">tripulante y</text>
<text x="726" y="148" font-size="13" fill="#59636e">reportes de cierre</text>
<line x1="24" y1="184" x2="856" y2="184" stroke="#d0d7de"/><circle cx="30" cy="209" r="4" fill="#0969da"/><text x="42" y="213" font-size="12" font-weight="600" letter-spacing="0.8" fill="#59636e">EN VIVO</text><text x="119" y="213" font-size="13" fill="#1f2328">Mapa de la flota · alertas por montos sin cobrar sobre S/ 1,000 · rutas detenidas</text>
</svg>
